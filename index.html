<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal – Visagist Haircuts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0D0D0D;
      color: #E5E5E5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .app-name { font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8B44D4; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.45); font-size: 14px; margin-bottom: 36px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.card {
      display: block;
      background: #181818;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 20px 24px;
      text-decoration: none;
      transition: border-color 0.2s;
    }
    a.card:hover { border-color: #8B44D4; }
    a.card h2 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    a.card p { font-size: 13px; color: rgba(255,255,255,0.42); margin: 0; }
    footer { margin-top: 48px; font-size: 12px; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-name">Visagist Haircuts</div>
    <h1>Legal Documents</h1>
    <p>Official policies for the Visagist Haircuts app (com.visagist.haircuts)</p>
    <div class="links">
      <a class="card" href="./privacy-policy.html">
        <h2>Privacy Policy</h2>
        <p>How we collect, use, and protect your data</p>
      </a>
      <a class="card" href="./terms-and-conditions.html">
        <h2>Terms &amp; Conditions</h2>
        <p>Rules and guidelines for using the App</p>
      </a>
    </div>
    <footer>© 2026 Visagist Haircuts · <a href="mailto:oteizanagi@gmail.com" style="color:rgba(255,255,255,0.3);">oteizanagi@gmail.com</a></footer>
  </div>

</html>
